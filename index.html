<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今晚吃什麼？- Overpass 免費版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .hidden { display: none; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center p-6">

    <header class="text-center my-8">
        <h1 class="text-4xl font-black text-orange-500 mb-2">今晚吃什麼？</h1>
        <p class="text-slate-500">免金鑰版：三題決定你的晚餐</p>
    </header>

    <main id="app-container" class="w-full max-w-md bg-white rounded-[2.5rem] shadow-2xl p-8 min-h-[400px] flex flex-col justify-center relative overflow-hidden">
        
        <div id="q1" class="quiz-step fade-in">
            <span class="text-orange-500 font-bold mb-2 block">STEP 01</span>
            <h2 class="text-2xl font-bold text-slate-800 mb-6">現在想吃什麼價位？</h2>
            <div class="space-y-4">
                <button onclick="nextStep('q1', 'q2', {price: 'low'})" class="w-full p-5 text-left border-2 border-slate-100 rounded-2xl hover:border-orange-400 hover:bg-orange-50 font-medium text-slate-700">🍜 平價小吃</button>
                <button onclick="nextStep('q1', 'q2', {price: 'mid'})" class="w-full p-5 text-left border-2 border-slate-100 rounded-2xl hover:border-orange-400 hover:bg-orange-50 font-medium text-slate-700">🍱 一般餐廳</button>
            </div>
        </div>

        <div id="q2" class="quiz-step hidden fade-in">
            <span class="text-orange-500 font-bold mb-2 block">STEP 02</span>
            <h2 class="text-2xl font-bold text-slate-800 mb-6">想在哪裡吃？</h2>
            <div class="space-y-4">
                <button onclick="nextStep('q2', 'q3', {tag: 'restaurant'})" class="w-full p-5 text-left border-2 border-slate-100 rounded-2xl hover:border-orange-400 hover:bg-orange-50 font-medium text-slate-700">🪑 坐在店裡吃</button>
                <button onclick="nextStep('q2', 'q3', {tag: 'cafe'})" class="w-full p-5 text-left border-2 border-slate-100 rounded-2xl hover:border-orange-400 hover:bg-orange-50 font-medium text-slate-700">☕ 咖啡廳氣氛</button>
                <button onclick="nextStep('q2', 'q3', {tag: 'fast_food'})" class="w-full p-5 text-left border-2 border-slate-100 rounded-2xl hover:border-orange-400 hover:bg-orange-50 font-medium text-slate-700">🏠 買回家裡吃</button>
            </div>
        </div>

        <div id="q3" class="quiz-step hidden fade-in">
            <span class="text-orange-500 font-bold mb-2 block">STEP 03</span>
            <h2 class="text-2xl font-bold text-slate-800 mb-6">距離限制？</h2>
            <div class="space-y-4">
                <button onclick="finishQuiz(500)" class="w-full p-5 text-left border-2 border-slate-100 rounded-2xl hover:border-orange-400 hover:bg-orange-50 font-medium text-slate-700">🚶 走幾步路 (500m)</button>
                <button onclick="finishQuiz(2000)" class="w-full p-5 text-left border-2 border-slate-100 rounded-2xl hover:border-orange-400 hover:bg-orange-50 font-medium text-slate-700">🛵 騎車可到 (2km)</button>
            </div>
        </div>

        <div id="loading" class="hidden text-center fade-in">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-orange-500 mx-auto"></div>
            <p class="mt-4 text-slate-600 font-bold">正在搜尋 OpenStreetMap 餐廳資料...</p>
        </div>

        <div id="result-area" class="hidden fade-in">
            <h2 class="text-2xl font-bold text-slate-800 mb-4 text-center">為你推薦！</h2>
            <div id="restaurant-list" class="space-y-4"></div>
            <button onclick="location.reload()" class="w-full mt-6 bg-slate-800 text-white p-4 rounded-2xl font-bold">重新選擇</button>
        </div>
    </main>

    <script>
        let answers = {};
        let userLocation = null;

        // 取得定位
        navigator.geolocation.getCurrentPosition(
            (pos) => userLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude },
            () => alert("請開啟定位權限才能搜尋附近的餐廳！")
        );

        function nextStep(current, next, data) {
            answers = { ...answers, ...data };
            document.getElementById(current).classList.add('hidden');
            document.getElementById(next).classList.remove('hidden');
        }

        function finishQuiz(radius) {
            answers.radius = radius;
            document.getElementById('q3').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');
            fetchOverpassData();
        }

        async function fetchOverpassData() {
            if (!userLocation) return alert("定位中，請再試一次");

            // Overpass QL 查詢語法：在使用者周圍 radius 米搜尋指定 tag
            const query = `
                [out:json];
                (
                  node["amenity"="${answers.tag}"](around:${answers.radius},${userLocation.lat},${userLocation.lng});
                  way["amenity"="${answers.tag}"](around:${answers.radius},${userLocation.lat},${userLocation.lng});
                );
                out center;`;

            const url = "https://overpass-api.de/api/interpreter?data=" + encodeURIComponent(query);

            try {
                const response = await fetch(url);
                const data = await response.json();
                const results = data.elements;

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('result-area').classList.remove('hidden');

                if (results.length > 0) {
                    const selected = results.sort(() => 0.5 - Math.random()).slice(0, 3);
                    renderCards(selected);
                } else {
                    document.getElementById('restaurant-list').innerHTML = "<p class='text-center text-slate-400'>附近找不到符合條件的店...</p>";
                }
            } catch (err) {
                alert("搜尋失敗，請檢查網路連線");
            }
        }

        function renderCards(places) {
            const list = document.getElementById('restaurant-list');
            list.innerHTML = places.map(place => {
                const name = place.tags.name || "未命名餐廳";
                const addr = place.tags["addr:full"] || place.tags["addr:street"] || "點擊查看地圖";
                // 使用美食插畫代替 API 照片
                const placeholder = "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=200&h=200&fit=crop";
                const mapUrl = `https://www.google.com/maps/search/?api=1&query=${place.lat || place.center.lat},${place.lon || place.center.lon}`;

                return `
                    <div class="bg-slate-50 rounded-2xl p-4 border border-slate-100 flex items-center space-x-4">
                        <img src="${placeholder}" class="w-16 h-16 rounded-xl object-cover">
                        <div class="flex-1">
                            <h3 class="font-bold text-slate-800">${name}</h3>
                            <p class="text-xs text-slate-400 mb-2">${addr}</p>
                            <a href="${mapUrl}" target="_blank" class="text-orange-500 text-xs font-bold font-bold underline">地圖導航 →</a>
                        </div>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
