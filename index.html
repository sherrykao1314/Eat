<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今晚吃什麼？- 晚餐決策器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .card-transition { transition: all 0.5s ease; }
        .hidden-card { display: none; opacity: 0; transform: translateX(50px); }
    </style>
</head>
<body class="bg-orange-50 min-h-screen flex flex-col items-center justify-center p-4">

    <h1 class="text-3xl font-bold text-orange-600 mb-8">🍴 今晚吃什麼？</h1>

    <div id="quiz-container" class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md relative overflow-hidden">
        
        <div id="q1" class="quiz-step card-transition">
            <h2 class="text-xl font-semibold mb-4">Q1. 飢餓程度？</h2>
            <button onclick="nextStep('q1', 'q2', {price: 1})" class="w-full mb-3 p-4 border rounded-xl hover:bg-orange-100">只是填個肚子 ($)</button>
            <button onclick="nextStep('q1', 'q2', {price: 2})" class="w-full mb-3 p-4 border rounded-xl hover:bg-orange-100">正常食量 ($$)</button>
            <button onclick="nextStep('q1', 'q2', {price: 3})" class="w-full p-4 border rounded-xl hover:bg-orange-100">大吃一頓 ($$$)</button>
        </div>

        <div id="q2" class="quiz-step hidden-card card-transition">
            <h2 class="text-xl font-semibold mb-4">Q2. 想在哪裡吃？</h2>
            <button onclick="nextStep('q2', 'q3', {type: 'restaurant'})" class="w-full mb-3 p-4 border rounded-xl hover:bg-orange-100">輕鬆坐著吃</button>
            <button onclick="nextStep('q2', 'q3', {type: 'cafe'})" class="w-full mb-3 p-4 border rounded-xl hover:bg-orange-100">質感裝潢好拍照</button>
            <button onclick="nextStep('q2', 'q3', {type: 'meal_takeaway'})" class="w-full p-4 border rounded-xl hover:bg-orange-100">🏠 買回家裡耍廢吃</button>
        </div>

        <div id="q3" class="quiz-step hidden-card card-transition">
            <h2 class="text-xl font-semibold mb-4">Q3. 移動距離？</h2>
            <button onclick="finishQuiz(500)" class="w-full mb-3 p-4 border rounded-xl hover:bg-orange-100">下樓巷口 (500m)</button>
            <button onclick="finishQuiz(2000)" class="w-full mb-3 p-4 border rounded-xl hover:bg-orange-100">騎車可到 (2km)</button>
            <button onclick="finishQuiz(5000)" class="w-full p-4 border rounded-xl hover:bg-orange-100">為了美食可以遠征 (5km)</button>
        </div>

        <div id="loading" class="hidden-card text-center py-10">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-orange-500 mx-auto"></div>
            <p class="mt-4 text-gray-600">正在搜尋附近好吃的...</p>
        </div>
    </div>

    <div id="result-container" class="hidden-card w-full max-w-md mt-6">
        <div id="restaurant-cards" class="space-y-4">
            </div>
        <button onclick="location.reload()" class="w-full mt-6 bg-orange-500 text-white p-4 rounded-xl font-bold shadow-lg">重新測驗</button>
    </div>

    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&libraries=places"></script>

    <script>
        let userAnswers = {};
        let userCoords = null;

        // 取得定位
        navigator.geolocation.getCurrentPosition(pos => {
            userCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        }, err => alert("請開啟定位功能才能推薦餐廳喔！"));

        function nextStep(current, next, data) {
            userAnswers = { ...userAnswers, ...data };
            document.getElementById(current).classList.add('hidden-card');
            document.getElementById(next).classList.remove('hidden-card');
        }

        function finishQuiz(radius) {
            userAnswers.radius = radius;
            document.getElementById('q3').classList.add('hidden-card');
            document.getElementById('loading').classList.remove('hidden-card');
            
            searchRestaurants();
        }

        function searchRestaurants() {
            if (!userCoords) return alert("還沒取得定位，請稍候");

            const service = new google.maps.places.PlacesService(document.createElement('div'));
            const request = {
                location: userCoords,
                radius: userAnswers.radius,
                type: [userAnswers.type],
                maxPriceLevel: userAnswers.price,
                openNow: true
            };

            service.nearbySearch(request, (results, status) => {
                document.getElementById('loading').classList.add('hidden-card');
                document.getElementById('result-container').classList.remove('hidden-card');

                if (status === google.maps.places.PlacesServiceStatus.OK) {
                    // 只取前三名
                    const top3 = results.slice(0, 3);
                    renderCards(top3);
                } else {
                    document.getElementById('restaurant-cards').innerHTML = "<p class='text-center'>附近沒找到符合條件的，換個標籤試試？</p>";
                }
            });
        }

        function renderCards(restaurants) {
            const container = document.getElementById('restaurant-cards');
            container.innerHTML = restaurants.map(place => `
                <div class="bg-white p-4 rounded-2xl shadow-md flex items-center space-x-4 border-l-4 border-orange-400">
                    <img src="${place.photos ? place.photos[0].getUrl() : 'https://via.placeholder.com/100'}" class="w-20 h-20 object-cover rounded-lg">
                    <div class="flex-1">
                        <h3 class="font-bold text-lg">${place.name}</h3>
                        <p class="text-sm text-gray-500">⭐ ${place.rating || '無評分'} | ${place.vicinity}</p>
                        <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place.name)}&query_place_id=${place.place_id}" 
                           target="_blank" class="text-orange-500 text-sm font-semibold underline">地圖導航 →</a>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
